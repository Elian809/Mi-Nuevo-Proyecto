<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Airline Reservation - Vuelos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="topbar">
        <div>
          <h1>Vuelos</h1>
          <p>Administra los vuelos disponibles</p>
        </div>
        <button class="btn btn-primary" id="btn-nuevo" style="width:auto;">+ Nuevo Vuelo</button>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <input type="text" id="buscar" placeholder="Buscar: número de vuelo, origen o destino...">
          <div style="display:flex; gap:8px;">
            <select id="filtro-estado">
              <option value="">Todos los estados</option>
              <option value="Disponible">Disponible</option>
              <option value="Cancelado">Cancelado</option>
              <option value="Completo">Completo</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th><th>Número</th><th>Origen</th><th>Destino</th><th>Fecha</th>
              <th>Hora</th><th>Precio</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-vuelos"></tbody>
        </table>
        <div class="pagination" id="paginacion"></div>
      </div>
    </main>
  </div>

  <!-- Modal Nuevo/Editar Vuelo -->
  <div class="modal-overlay hidden" id="modal-vuelo">
    <div class="modal">
      <h3 id="modal-titulo">Nuevo Vuelo</h3>
      <form id="form-vuelo">
        <input type="hidden" id="vuelo-id">
        <div class="form-row">
          <div class="field"><label>Número</label><input type="text" id="v-numero" required placeholder="AR106"></div>
          <div class="field"><label>Precio</label><input type="number" step="0.01" id="v-precio" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Origen (código)</label><input type="text" id="v-origen" maxlength="4" required placeholder="SDQ"></div>
          <div class="field"><label>Ciudad origen</label><input type="text" id="v-origen-ciudad" required placeholder="Santo Domingo"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Destino (código)</label><input type="text" id="v-destino" maxlength="4" required placeholder="MIA"></div>
          <div class="field"><label>Ciudad destino</label><input type="text" id="v-destino-ciudad" required placeholder="Miami"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Fecha</label><input type="date" id="v-fecha" required></div>
          <div class="field"><label>Hora</label><input type="time" id="v-hora" required></div>
        </div>
        <div class="field" id="campo-estado-wrap" style="display:none;">
          <label>Estado</label>
          <select id="v-estado">
            <option value="Disponible">Disponible</option>
            <option value="Cancelado">Cancelado</option>
            <option value="Completo">Completo</option>
          </select>
        </div>
        <div id="modal-error" class="error-msg hidden"></div>
        <div class="actions">
          <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Confirmar Eliminar -->
  <div class="modal-overlay hidden" id="modal-eliminar">
    <div class="modal">
      <h3>Eliminar vuelo</h3>
      <p>¿Seguro que deseas eliminar este vuelo? Esta acción no se puede deshacer.</p>
      <div class="actions">
        <button class="btn btn-secondary" id="btn-cancelar-eliminar">Cancelar</button>
        <button class="btn btn-danger" id="btn-confirmar-eliminar">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/vuelos.js"></script>
</body>
</html>
