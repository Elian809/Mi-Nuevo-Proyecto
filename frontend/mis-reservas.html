<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Airline Reservation - Mis Reservas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="titulo-pagina">Mis Reservas</h1>
          <p>Consulta el estado de tus reservas</p>
        </div>
        <button class="btn btn-primary" style="width:auto;" onclick="window.location.href='vuelos.html'">+ Nueva Reserva</button>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <input type="text" id="buscar" placeholder="Buscar: número de reserva o vuelo...">
          <select id="filtro-estado">
            <option value="Todos">Todos</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Reserva</th><th>Vuelo</th><th>Ruta</th><th>Fecha</th>
              <th>Asientos</th><th>Total</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-reservas"></tbody>
        </table>
      </div>

      <div class="stat-strip" id="stat-strip"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/mis-reservas.js"></script>
</body>
</html>
