<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Airline Reservation - Iniciar Sesión</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-hero"><span>✈️</span></div>
    <div class="login-panel">
      <div class="login-box">
        <div class="brand">
          <span class="icon">✈️</span>
          <h1>AIRLINE<br>RESERVATION</h1>
        </div>
        <h2>Iniciar Sesión</h2>
        <div id="error" class="error-msg hidden"></div>
        <form id="form-login">
          <div class="field">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
        <p class="foot-link">¿No tienes cuenta? <a href="register.html" style="color:#2563eb;font-weight:600;">Regístrate</a></p>
        <p class="foot-link" style="margin-top:20px;">Demo: admin@airline.com / 123456</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error');
      errorBox.classList.add('hidden');

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
